# Quality gates on every push and PR: the same commands a developer runs
# locally. `build` includes the prebuild `validate` (content integrity), so a
# broken slug reference or quote fails CI the same way it fails a deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # @emnapi/* sit in devDependencies only so the lockfile carries their
      # top-level entries: the bundled wasm deps of @tailwindcss/oxide otherwise
      # break `npm ci` on linux (tailwindlabs/tailwindcss#20324).
      - run: npm ci
      - run: npm run lint
      # PageProps and the image-module declarations are generated types
      # (.next/types, next-env.d.ts) — on a fresh runner they don't exist
      # until `next typegen` writes them.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify-quotes
      - run: npm run build
